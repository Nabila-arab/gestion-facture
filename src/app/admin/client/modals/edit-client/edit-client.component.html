
<div class="modal">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <h2>Éditer le client</h2>
      <form [formGroup]="editForm" (ngSubmit)="onSave()">
        <div class="form-group">
          <label for="raison">Raison Sociale :</label>
          <input id="raison" type="text" formControlName="raisonSociale">
        </div>

        <div class="form-group">
          <label for="telephone">Téléphone :</label>
          <input id="telephone" type="text" formControlName="telephone">
        </div>

        <div class="form-group">
          <label for="email">Email :</label>
          <input id="email" type="email" formControlName="email">
        </div>

        <div class="form-group">
          <label for="adresse">Adresse :</label>
          <input id="adresse" type="text" formControlName="adresse">
        </div>

        <div class="button-group">
          <button type="submit">Enregistrer</button>
          <button type="button" (click)="closeModal.emit()">Annuler</button>
        </div>
      </form>
    </div>  
  </div>
</div>
