<div class="container">
  <h3>Liste des clients</h3>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Raison sociale
          <input type="text" class="form-control" placeholder="Filtrer..." (input)="updateFilter('raisonSociale', $event)">
        </th>
        <th>Téléphone
          <input type="text" class="form-control" placeholder="Filtrer..." (input)="updateFilter('telephone', $event)">
        </th>
        <th>Email
          <input type="text" class="form-control" placeholder="Filtrer..." (input)="updateFilter('email', $event)">
        </th>
        <th>Adresse
          <input type="text" class="form-control" placeholder="Filtrer..." (input)="updateFilter('adresse', $event)">
        </th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let client of filteredClients">
        <td>{{ client.raisonSociale }}</td>
        <td>{{ client.telephone }}</td>
        <td>{{ client.email}}</td>
        <td>{{ client.adresse}}</td>
        <td>
          <button class="btn btn-primary" (click)="openEditModal(client)">
            Éditer
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Affichage de la modale -->

<app-edit-client
*ngIf="isEditModalOpen"
[selectedClient]="selectedClient"
(closeModal)="closeEditModal()"
(saveChanges)="saveClient($event)">
</app-edit-client>
