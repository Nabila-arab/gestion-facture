<div class="container">
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Raison Sociale</label>
        <input
          type="text"
          [(ngModel)]="client.raisonSociale"
          name="raisonSociale"
          required
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label>Téléphone</label>
        <input
          type="text"
          [(ngModel)]="client.telephone"
          name="telephone"
          required
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input
          type="text"
          [(ngModel)]="client.email"
          name="email"
          required
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label>Adresse</label>
        <input
          type="Adresse"
          [(ngModel)]="client.adresse"
          name="adresse"
          required
          class="form-control"
        />
      </div>
      
      <button type="submit" class="btn btn-primary">Ajouter</button>
    </form>
  </div>
